[package]
name = "openether-strategy-momentum"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Momentum strategy compiled to WASM and executed inside the openEther sandbox"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
